name: Inference Chart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add NVIDIA Helm repository
        run: helm repo add nvidia https://nvidia.github.io/k8s-device-plugin

      - name: Build locked dependencies
        run: helm dependency build helm/inference

      - name: Lint and render inference chart
        run: |
          helm lint --strict helm/inference
          helm template inference helm/inference --namespace inference

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install "PyYAML>=6,<7" ruff

      - name: Lint and test chart contracts
        run: |
          ruff check tests/
          python -m unittest discover -s tests -v

  publish-chart:
    if: ${{ vars.HELM_CHART_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: chart-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add NVIDIA Helm repository
        run: helm repo add nvidia https://nvidia.github.io/k8s-device-plugin

      - name: Build locked dependencies
        run: helm dependency build helm/inference

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Package and publish inference chart
        run: |
          mkdir -p "$RUNNER_TEMP/chart-package"
          helm package helm/inference --destination "$RUNNER_TEMP/chart-package"
          helm push "$RUNNER_TEMP/chart-package"/inference-*.tgz oci://ghcr.io/utopiklab/inference-platform
