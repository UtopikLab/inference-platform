{{- $ns := .Release.Namespace -}}
{{- $inf := .Values.inference -}}
{{- $plugin := index .Values "nvidia-device-plugin" -}}
{{- if and $plugin.enabled $plugin.namespaceOverride (ne $plugin.namespaceOverride .Release.Namespace) -}}
{{- fail "nvidia-device-plugin.namespaceOverride must match the release namespace" -}}
{{- end -}}
{{- $profileNames := dict -}}
{{- range $cfg := $inf.servers }}
{{- if hasKey $profileNames $cfg.name }}
{{- fail (printf "inference.servers profile names must be unique: %q" $cfg.name) -}}
{{- end }}
{{- $_ := set $profileNames $cfg.name true -}}
{{- range $arg := concat ($cfg.modelArgs | default list) ($cfg.serverArgs | default list) }}
{{- if or (eq $arg "--host") (eq $arg "--port") (hasPrefix "--host=" $arg) (hasPrefix "--port=" $arg) }}
{{- fail (printf "inference.servers[%s] must configure listener host/port through service.port, not args" $cfg.name) -}}
{{- end }}
{{- end }}
{{- end -}}
{{- range $cfg := $inf.servers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $.Chart.Name | quote }}
    component: {{ $.Release.Name | default "inference" | quote }}
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/managed-by: Helm
    inference.profile: {{ $cfg.name | quote }}
spec:
  replicas: {{ $cfg.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference-server
      inference.profile: {{ $cfg.name | quote }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  template:
    metadata:
      labels:
        app: inference-server
        inference.profile: {{ $cfg.name | quote }}
        app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    spec:
      {{- with $inf.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $inf.imagePullSecrets | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["inference-server"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: llama-server
          image: {{ $inf.image }}
          imagePullPolicy: {{ $inf.imagePullPolicy | default "Always" }}
          args:
            - --host
            - "0.0.0.0"
            - --port
            - {{ $cfg.service.port | quote }}
            {{- with $cfg.modelArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $cfg.serverArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: LLAMA_CACHE
              value: {{ printf "%s/llama.cpp/%s" $cfg.modelDir $cfg.name | quote }}
          volumeMounts:
            - name: models
              mountPath: {{ $cfg.modelDir | quote }}
          ports:
            - name: http
              containerPort: {{ $cfg.service.port }}
              protocol: TCP
          resources: {{ toYaml $cfg.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ $.Values.inference.pvc.name }}
{{- end }}
