{{- $ingress := .Values.inference.ingress }}
{{- if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-inference-ingress
  namespace: {{ .Values.namespace }}
  {{- with $ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ .Chart.Name }}
    component: {{ .Release.Name }}
    app.kubernetes.io/component: inference-server
    app.k8s.io/managed-by: Helm
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "inference.ingress.host is required when ingress is enabled" $ingress.host | quote }}
      http:
        paths:
          - path: {{ $ingress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: inference-server
                port:
                  number: 8000
{{- end }}
