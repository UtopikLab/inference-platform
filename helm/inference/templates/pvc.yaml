{{- $pvc := .Values.inference.pvc }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvc.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if or (ne $pvc.storageClassName nil) .Values.inference.pv.create }}
  storageClassName: {{ $pvc.storageClassName | default "" | quote }}
  {{- end }}
  {{- if or $pvc.volumeName .Values.inference.pv.create }}
  volumeName: {{ $pvc.volumeName | default (.Values.inference.pv.name | default $pvc.name) | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pvc.storage | quote }}
